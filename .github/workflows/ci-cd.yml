name: Deploy to AWS ECS

on:
  push:
    branches:
      - final-mservices  # Triggers deployment when code is pushed to the 'final' branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Ensure this matches your AWS region

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # ✅ Build and Push Monolithic App (Auth + Frontend)
      - name: Build and Push Monolithic App
        run: |
          ECR_REPO_URI=548895127859.dkr.ecr.us-east-1.amazonaws.com/flask-app
          docker build -t $ECR_REPO_URI:monolithic-latest  . 
          docker push $ECR_REPO_URI:monolithic-latest
          echo "ECR_REPO_URI=$ECR_REPO_URI" >> $GITHUB_ENV

      # ✅ Build and Push Doctor Search Microservice with a different tag
      - name: Build and Push Doctor Search Microservice
        run: |
          ECR_REPO_URI=548895127859.dkr.ecr.us-east-1.amazonaws.com/flask-app
          docker build -t $ECR_REPO_URI:doctor-search-latest ./services/doctors_search_service  
          docker push $ECR_REPO_URI:doctor-search-latest

      # ✅ Deploy Monolithic App (Auth + Frontend) to ECS
      - name: Deploy Monolithic App to ECS
        run: |
          aws ecs update-service --cluster flask-cluster --service flask-frontend --force-new-deployment

      # ✅ Deploy Doctor Search Microservice to ECS
      - name: Deploy Doctor Search Microservice to ECS
        run: |
          aws ecs update-service --cluster flask-cluster --service flask-doctorsearch --force-new-deployment
