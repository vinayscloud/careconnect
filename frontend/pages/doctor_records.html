<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Patient Records</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/doctor-records.css') }}">
</head>

<body>
    <div class="container mt-4">
        <h2 class="text-center">Doctor Patient Records</h2>
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Appointment Date</th>
                    <th>Doctor Notes</th>
                    <th>Patient Notes</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="doctor-patient-records">
                <!-- Records will be inserted here dynamically -->
            </tbody>
        </table>
    </div>

    <script src="{{ url_for('static', filename='scripts/doctor_records.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
