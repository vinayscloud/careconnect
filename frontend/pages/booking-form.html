<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment - CareConnect</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/fontawesome.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/navbar.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" />

  <style>
    body {
      background: url('{{ url_for("static", filename="images/hospital-background.jpg") }}') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar{
      background-color: #265282 !important;
    }

    .appointment-form {
      max-width: 700px;
      margin: 2rem auto;
      background-color: rgba(255, 255, 255, 0.95);
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #265282;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form-floating {
      margin-bottom: 1rem;
    }

    .btn-primary {
      width: 100%;
      background-color: #007bff;
      border: none;
      padding: 0.75rem;
      transition: background-color 0.3s;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    .back-btn a {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
    }

    .confirmation {
      color: green;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top" id="mainNavbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="{{ url_for('auth.dashboard') }}">
        <i class="fas fa-heartbeat mr-2"></i> <strong>CareConnect</strong>
      </a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('auth.dashboard') }}">
              <i class="fas fa-tachometer-alt mr-2"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('load_page', page_name='notifications') }}">
              <i class="fas fa-bell mr-2"></i> Notifications
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center"
              href="{{ url_for('load_page', page_name='doctor_update_profile') }}">
              <i class="fas fa-user-edit mr-2"></i> Profile
            </a>
          </li>
          {% if session['token'] %}
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="#" data-toggle="modal" data-target="#logoutModal">
              <i class="fas fa-sign-out-alt mr-2"></i> Logout
            </a>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('load_page', page_name='login') }}">
              <i class="fas fa-sign-in-alt mr-2"></i> Login
            </a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <div class="appointment-form">
    <h1>Doctor Appointment Request Form</h1>
    <form id="appointment-form">
      <input type="hidden" id="doctorId" name="doctorId" value="{{ doctor.id }}">
      <input type="hidden" id="doctorName" name="doctorName" value="{{ doctor.name }}">
      <input type="hidden" id="patientId" name="patientId" value="{{ patient_id }}">

      <div class="form-floating">
        <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
        <label for="name">Full Name</label>
      </div>
      <div class="form-floating">
        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email address"
          required>
        <label for="email">Email Address</label>
      </div>
      <div class="form-floating">
        <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter your phone number" required>
        <label for="phone">Phone Number</label>
      </div>
      <div class="form-floating mb-3">
        <select id="gender" name="gender" class="form-select">
          <option value="" selected>Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
        <label for="gender">Gender</label>
      </div>
      <div class="form-floating mb-3">
        <input type="date" class="form-control" id="date" name="date" required>
        <label for="date">Preferred Date</label>
      </div>
      <div class="form-floating mb-3">
        <select id="time" name="time" class="form-select" required>
          <option value="">Loading slots...</option>
        </select>
        <label for="time">Available Time Slots</label>
      </div>
      <div class="form-floating">
        <textarea class="form-control" id="notes" name="notes"
          placeholder="Enter any special notes or symptoms"></textarea>
        <label for="notes">Special Notes or Symptoms</label>
      </div>
      <button type="submit" class="btn btn-primary">Submit Appointment</button>
    </form>

    <div class="confirmation" id="confirmation" style="display: none">
      ✅ Your appointment has been successfully booked!
    </div>

    <div class="back-btn btn-primary btn mt-2">
      <a href="{{ url_for('load_page', page_name='doctor-profile') }}">Cancel</a>
    </div>
  </div>

  <!-- Logout Confirmation Modal -->
  <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="logoutModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header text-white">
          <h5 class="modal-title" id="logoutModalLabel">Confirm Logout</h5>
          <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          Are you sure you want to logout?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <a href="{{ url_for('auth.logout') }}" class="btn btn-danger">Logout</a>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='scripts/jquery-3.5.1.slim.min.js') }}"></script>
  <script src="{{ url_for('static', filename='scripts/bootstrap.bundle.min.js') }}"></script>
  <script>
    const form = document.getElementById("appointment-form");
    const timeSelect = document.getElementById("time");
    const doctorId = document.getElementById("doctorId").value;

    function loadTimeSlots(date) {
      timeSelect.innerHTML = '<option value="">Loading...</option>';
      fetch(`/doctor-availability/slots?doctor_id=${doctorId}&date=${date}`)
        .then(res => res.json())
        .then(slots => {
          timeSelect.innerHTML = '';
          if (slots.length === 0) {
            timeSelect.innerHTML = '<option value="">No available slots</option>';
          } else {
            timeSelect.innerHTML = '<option value="">Select Time</option>';
            slots.forEach(slot => {
              const option = document.createElement("option");
              option.value = slot.start_time;
              option.textContent = slot.start_time;
              timeSelect.appendChild(option);
            });
          }
        })
        .catch(err => {
          console.error("Failed to fetch slots", err);
          timeSelect.innerHTML = '<option value="">Error loading slots</option>';
        });
    }

    document.getElementById("date").addEventListener("change", (e) => {
      const date = e.target.value;
      if (date) loadTimeSlots(date);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const requestData = {
        patientId: formData.get("patientId"),
        doctorId: formData.get("doctorId"),
        doctorName: formData.get("doctorName"),
        name: formData.get("name"),
        email: formData.get("email"),
        phone: formData.get("phone"),
        date: formData.get("date"),
        time: formData.get("time"),
        notes: formData.get("notes"),
        gender: formData.get("gender")
      };

      fetch("/booking-form", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestData),
      })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            form.style.display = "none";
            document.getElementById("confirmation").style.display = "block";
          } else {
            alert("❌ Error: " + (data.error || "Could not book appointment."));
          }
        })
        .catch(error => {
          console.error("Error submitting appointment:", error);
          alert("An error occurred. Please try again later.");
        });
    });

    // Preload time slots for today
    // Allow booking for any future date
    document.addEventListener("DOMContentLoaded", () => {
      const dateInput = document.getElementById("date");
      const today = new Date().toISOString().split("T")[0];
      dateInput.min = today;

      dateInput.addEventListener("change", (e) => {
        const date = e.target.value;
        if (date) loadTimeSlots(date);
      });
    });

  </script>
</body>

</html>
