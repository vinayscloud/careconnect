<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Patient Dashboard | CareConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/patient-records.css') }}">

  <style>
    body {
      background-color: #f1f4f9;
      font-family: "Segoe UI", sans-serif;
    }

    .navbar {
      background-color: #007bff;
    }

    .navbar-brand,
    .nav-link {
      color: white !important;
      font-weight: 500;
    }

    .dashboard-container {
      max-width: 1100px;
      margin: 40px auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-bottom: 25px;
      color: #333;
      text-align: center;
    }

    textarea.form-control {
      resize: none;
      font-size: 0.9rem;
    }

    .badge {
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <!-- ✅ Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">CareConnect</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ request.path }}">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('load_page', page_name='notifications') }}">Notifications</a></li>
          {% if session['token'] %}
            <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.logout') }}" onclick="return confirm('Logout?');">Logout</a></li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="{{ url_for('load_page', page_name='login') }}">Login</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <!-- ✅ Patient Dashboard Content -->
  <div class="dashboard-container">
    <h2>🩺 My Medical Records</h2>

    <div class="table-responsive">
      <table class="table table-bordered align-middle table-hover">
        <thead class="table-primary">
          <tr>
            <th>Doctor</th>
            <th>Date</th>
            <th>Doctor Notes</th>
            <th>My Notes</th>
            <th>Status</th>
            <th>Attachment</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="patient-records-body">
          <!-- Filled dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- ✅ Modal for History -->
  <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Record History</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="historyContent">
          <!-- History content via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Scripts -->
  <script src="{{ url_for('static', filename='scripts/patient_records.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
