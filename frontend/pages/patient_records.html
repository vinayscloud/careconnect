<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Patient Dashboard | CareConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/patient-records.css') }}">  
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/fontawesome.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/navbar.css') }}">

  <style>
    body {
      background-color: #f1f4f9;
      font-family: "Segoe UI", sans-serif;
    }

    .dashboard-container {
      margin: 40px;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    textarea.form-control {
      font-size: 0.9rem;
      resize: none;
    }

    .badge {
      font-size: 0.85rem;
    }

    .form-select {
      font-size: 0.85rem;
    }

    .btn-sm {
      margin-right: 4px;
    }
  </style>
</head>

<body>

  <!-- ✅ Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
        <i class="fas fa-heartbeat mr-2"></i> <strong>CareConnect</strong>
      </a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('auth.dashboard') }}">
              <i class="fas fa-tachometer-alt mr-2"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('load_page', page_name='notifications') }}">
              <i class="fas fa-bell mr-2"></i> Notifications
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('load_page', page_name='doctor-profile') }}">
              <i class="fas fa-user-edit mr-2"></i> Doctors
            </a>
          </li>
          {% if session['token'] %}
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('auth.logout') }}"
              onclick="return confirmLogout();">
              <i class="fas fa-sign-out-alt mr-2"></i> Logout
            </a>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('load_page', page_name='login') }}">
              <i class="fas fa-sign-in-alt mr-2"></i> Login
            </a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <!-- ✅ Patient Dashboard Content -->
  <div class="dashboard-container">
    <h2>🩺 My Medical Records</h2>

    <div class="table-responsive">
      <table class="table table-bordered align-middle table-hover">
        <thead class="table-primary">
          <tr>
            <th>Doctor</th>
            <th>Date</th>
            <th>Doctor Notes</th>
            <th>My Notes</th>
            <th>Status</th>
            <th>Attachment</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="patient-records-body">
          <!-- Filled dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- ✅ Modal for History -->
  <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Record History</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="historyContent">
          <!-- History content via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Scripts -->
  <script src="{{ url_for('static', filename='scripts/patient_records.js') }}"></script>
  <script src="{{ url_for('static', filename='scripts/jquery-3.5.1.slim.min.js') }}"></script>
  <script src="{{ url_for('static', filename='scripts/bootstrap.bundle.min.js') }}"></script>
</body>

</html>
