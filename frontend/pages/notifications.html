<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications Panel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/notifications.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/navbar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/fontawesome.min.css') }}">

  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #93bee9;
    }

    .navbar {
      background-color: #007bff;
      color: #fff;
    }

    .navbar .nav-link {
      color: #fff !important;
    }

    .navbar .navbar-brand {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .navbar-nav .nav-link {
      transition: color 0.2s ease-in-out;
    }

    .navbar-nav .nav-link:hover {
      color: #ffe082 !important;
      /* light amber highlight */
    }



    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #007bff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Navbar Section -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="{{ url_for('auth.dashboard') }}">
        <i class="fas fa-heartbeat mr-2"></i> <strong>CareConnect</strong>
      </a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('auth.dashboard') }}">
              <i class="fas fa-tachometer-alt mr-2"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('load_page', page_name='notifications') }}">
              <i class="fas fa-bell mr-2"></i> Notifications
            </a>
          </li>
          <!-- <li class="nav-item">
            <a class="nav-link d-flex align-items-center"
              href="{{ url_for('load_page', page_name='doctor_update_profile') }}">
              <i class="fas fa-user-edit mr-2"></i> Profile
            </a>
          </li> -->
          {% if session['token'] %}
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('auth.logout') }}"
              onclick="return confirmLogout();">
              <i class="fas fa-sign-out-alt mr-2"></i> Logout
            </a>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('load_page', page_name='login') }}">
              <i class="fas fa-sign-in-alt mr-2"></i> Login
            </a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>



  <!-- <div class="navbar">
    <div class="brand">
      <a class="nav-app-name" href="{{ url_for('index') }}">CareConnect</a>
    </div>
    <div class="notifications">
      <span class="notification-icon">🔔</span>
      <span class="notification-badge" style="display: none;">0</span>
    </div>
  </div> -->

  <!-- <div class="notifications">
    <span class="icon">🔔</span>
    <span class="badge">0</span>
  </div> -->

  <div class="notifications-panel" id="notifications-panel">
    <h1>Notifications</h1>
    <ul id="notifications-list">
      <div id="loader" class="loader" style="display: none;"></div>
      <!-- Notifications will be dynamically added here -->
    </ul>
  </div>

  <script src="{{ url_for('static', filename='scripts/jquery-3.5.1.slim.min.js') }}"></script>
  <script src="{{ url_for('static', filename='scripts/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='scripts/notifications.js') }}"></script>
  <script>
    function confirmLogout() {
      return confirm("Are you sure you want to logout?");
    }
  </script>
</body>

</html>
